name: Atualizar monitoramento UE

# Coleta automática das fontes oficiais da União Europeia (motor legislativo
# do Parlamento + conectores regulatórios), rebuild do site estático e
# validação. Commita somente quando há alteração real no dataset ou nas
# páginas geradas. O deploy na Vercel é acionado pelo push (a Vercel executa
# `python3 scripts/build_site.py` e publica `docs/`).
#
# A coleta publica resultados parciais quando build e validação passam.
# Falhas de build nunca publicam páginas quebradas; o dataset fica em artifact.
# A coleta pública não depende de banco, SMTP ou credenciais comerciais.
on:
  schedule:
    # Diário às 07:17 de Bruxelas (05:17 UTC no verão europeu / 06:17 no inverno).
    # Evita o minuto 0, quando o GitHub atrasa os agendamentos por excesso de jobs.
    - cron: "17 5 * * *"
    # Repetições diárias às 10:43, 14:43 e 18:43 de Bruxelas (08:43/12:43/16:43 UTC).
    # O GitHub pode atrasar ou descartar um disparo; não dependemos de uma única
    # oportunidade diária.
    - cron: "43 8,12,16 * * *"
  workflow_dispatch:
    inputs:
      orcamento_minutos:
        description: "Teto de duração da coleta, em minutos (padrão: 25)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-legislation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  # Orçamento da coleta: mantém coleta + build + validação + commit dentro do
  # timeout do job. Ao estourar, o coletor grava o que verificou, marca a
  # execução como "parcial" e o site é publicado do mesmo jeito.
  MONITOR_BUDGET_SEGUNDOS: "1500"   # 25 min
  MONITOR_MAX_NOVAS: "25"           # fichas novas detalhadas por execução

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Coletar dados oficiais
        id: coleta
        # A coleta pode ser parcial (orçamento) ou falhar: o objetivo é publicar
        # o dataset verificado e sinalizar o problema no fim do job.
        continue-on-error: true
        timeout-minutes: 40
        env:
          ORCAMENTO_MINUTOS: ${{ inputs.orcamento_minutos }}
        run: |
          ARGS=()
          if [ -n "${ORCAMENTO_MINUTOS}" ]; then
            ARGS=(--budget-min "${ORCAMENTO_MINUTOS}")
          fi
          python3 scripts/update_legislation.py "${ARGS[@]}"

      - name: Rebuild do site
        id: build
        if: always()
        run: python3 scripts/build_site.py

      - name: Validar dataset e páginas
        id: validate
        if: always()
        run: python3 scripts/validate_site.py

      - name: Resumo da execução
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/legislation/updates.json")
          if not p.exists():
              print("Sem updates.json"); raise SystemExit(0)
          ups = json.loads(p.read_text(encoding="utf-8"))
          ex = (ups.get("execucoes") or [{}])[0]
          http = ex.get("http") or {}
          linhas = [
              "## Monitoramento UE — execução do dia",
              "",
              f"- **Status:** `{ex.get('status', '—')}`",
              f"- **Início/fim:** {ex.get('data_hora', '—')} → {ex.get('fim', '—')}",
              f"- **Duração:** {ex.get('duracao_segundos', '—')}s de {ex.get('orcamento_segundos', '—')}s de orçamento",
              f"- **Procedimentos:** {ex.get('procedimentos_verificados', ex.get('proposicoes_verificadas', '—'))} verificados de "
              f"{ex.get('procedimentos_monitorados', ex.get('proposicoes_monitoradas', '—'))} monitorados "
              f"({ex.get('cobertura_pct', '—')}% de cobertura; "
              f"{ex.get('procedimentos_pendentes', 0)} pendentes)",
              f"- **Mudanças:** {ex.get('mudancas_detectadas', '—')} · "
              f"**novos procedimentos:** {ex.get('novos_procedimentos', '—')} · "
              f"**eventos:** {ex.get('eventos_adicionados', '—')}",
              f"- **HTTP:** {http.get('chamadas', '—')} chamadas · "
              f"{http.get('cache', 0)} do cache · {http.get('falhas', 0)} falhas · "
              f"{http.get('tempo_total', '—')}s em rede",
              f"- **Erros:** {len(ex.get('erros') or [])}",
              f"- **Status global (multiórgão):** `{ex.get('status_global', '—')}`",
          ]
          fm = ex.get("fontes_monitoradas") or {}
          if fm:
              linhas += ["", "| órgão | status | itens consultados | novidades | erros |",
                         "|---|---|---|---|---|"]
              for orgao, f in fm.items():
                  linhas.append(f"| {orgao} | {f.get('status', '—')} | "
                                f"{f.get('itens_consultados', '—')} | "
                                f"{f.get('novidades', '—')} | {f.get('erros', 0)} |")
          falhas = ex.get("fontes_falha") or []
          if falhas:
              linhas.append("")
              linhas.append("**Fontes com falha nesta execução:** "
                            + ", ".join(falhas))
          print("\n".join(linhas))
          PY

      - name: Detectar mudanças reais
        id: diff
        if: always()
        run: |
          if git status --porcelain | grep .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit e push (somente se houver alteração)
        if: always() && steps.diff.outputs.changed == 'true' && steps.build.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          git config user.name "monitor-ia-ue-bot"
          git config user.email "monitor-ia-ue-bot@users.noreply.github.com"
          git add -A data docs
          # Evita commit vazio em caso de corrida: só commita se houver staged diff
          if git diff --cached --quiet; then
            echo "Nenhuma alteração real. Nada a commitar."
          else
            DATA=$(date -u +%Y-%m-%d)
            STATUS=$(python3 -c "import json;print((json.load(open('data/legislation/updates.json')).get('execucoes') or [{}])[0].get('status','?'))")
            git commit -m "chore: atualização automática do monitor UE ($DATA) [$STATUS]" -m "Execução do coletor (update_legislation.py) + rebuild (build_site.py). Mudanças e métricas em data/legislation/updates.json — painel em /monitoramento/."
            git push
          fi

      - name: Conferir saúde da coleta publicada
        if: always() && steps.build.outcome == 'success' && steps.validate.outcome == 'success'
        run: python3 scripts/check_collection.py

      - name: Preservar dados coletados em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coleta-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/legislation/*.json
          retention-days: 14

      - name: Sinalizar coleta incompleta (após tentativa de publicação)
        if: steps.coleta.outcome == 'failure'
        run: |
          echo "::error::A coleta não terminou com sucesso. Consulte as etapas de build e commit para confirmar a publicação — verifique o painel /monitoramento/ e os logs da etapa 'Coletar dados oficiais'."
          exit 1

