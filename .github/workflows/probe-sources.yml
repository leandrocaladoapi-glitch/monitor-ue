name: Sonda e ensaio das fontes oficiais (diagnóstico)

# Diagnóstico manual, em duas partes:
#   1. Sonda: consulta candidatos a endpoint oficial de cada órgão (ANPD, CNJ,
#      TSE, DOU, Planalto, MCTI) e publica resumo + amostras dos corpos.
#   2. Ensaio real: roda os coletores multiórgão de verdade (scripts/sources,
#      via scripts/update_sources.py --todas --dry-run) e publica o relatório
#      com o status de cada fonte, canais que responderam/falharam e amostras
#      dos itens com URL oficial.
# Nada é gravado no dataset, nada no site. Serve para comprovar, com evidência
# real de execução, qual fonte oficial cada órgão usa e se o coletor funciona.
on:
  workflow_dispatch:
  push:
    branches: ["arena/**", "main"]
    paths:
      - ".github/probe-trigger"
      - "scripts/probe_sources.py"
      - "scripts/update_sources.py"
      - "scripts/sources/**"
      - ".github/workflows/probe-sources.yml"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  MONITOR_FONTES_TIMEOUT_S: "150"
  MONITOR_FONTES_LIMITE_TOTAL_S: "900"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Ensaio real dos coletores multiórgão (sem gravar dados)
        run: |
          python3 scripts/update_sources.py --todas --dry-run \
            --relatorio out/fontes_reais.json --limite-amostras 8 \
            > out/fontes_reais.log 2>&1 || true
          tail -c 6000 out/fontes_reais.log
          python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY" || true
          import json, os
          print("\n## Ensaio dos coletores multiórgão")
          p = "out/fontes_reais.json"
          if not os.path.exists(p):
              print("_relatório não gerado — ver out/fontes_reais.log_")
              raise SystemExit(0)
          d = json.load(open(p, encoding="utf-8"))
          print(f"\n**status global: {d['status_global']}**\n")
          print("| órgão | status | itens | relevantes | canais ok | canais falhos | erro |")
          print("|---|---|---|---|---|---|---|")
          for orgao, f in d["fontes"].items():
              canais_ok = ", ".join(f["canais_ok"]) or "—"
              canais_err = ", ".join(f["canais_falhos"]) or "—"
              erro = (f.get("erro_detalhe") or "").replace("|", "/").replace("\n", " ")[:160]
              print(f"| {orgao} | {f['status']} | {f['itens_consultados']} | "
                    f"{f['itens_relevantes']} | {canais_ok} | {canais_err} | {erro} |")
          for orgao, f in d["fontes"].items():
              if not f["amostra"]:
                  continue
              print(f"\n<details><summary>amostra · {orgao}</summary>\n")
              for it in f["amostra"][:5]:
                  print(f"- [{it['titulo']}]({it['url_oficial']}) — {it['data']} "
                        f"· {it['tipo']} · {it['relevancia']}")
              print("\n</details>")
          PYEOF
      - name: Execução completa em --dry-run (mesmo caminho do workflow diário)
        run: |
          # Prova de ponta a ponta: roda update_legislation.py inteiro (Câmara e
          # Senado + fase 3.5 multiórgão) em modo --dry-run — consulta tudo,
          # monta o resumo por órgão e não grava o dataset.
          MONITOR_MAX_NOVAS=5 python3 scripts/update_legislation.py --dry-run \
            --budget-min 12 > out/execucao_dry_run.log 2>&1 || true
          tail -c 4000 out/execucao_dry_run.log
          python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY" || true
          import re
          texto = open("out/execucao_dry_run.log", encoding="utf-8", errors="replace").read()
          print("\n## Execução completa (dry-run)\n")
          linhas = [l for l in texto.splitlines() if any(
              chave in l for chave in ("multiórgão", "status_global", "mudança",
                                       "PARCIAL", "FALHA", "Coleta"))]
          print("```")
          print("\n".join(linhas[-40:]) or "(sem saída reconhecida)")
          print("```")
          PYEOF
      - name: Sondar endpoints (após o ensaio)
        run: |
          mkdir -p out
          python3 scripts/probe_sources.py --conjunto detalhe --limite-exemplo 300 \
            --salvar-dir out/probe > out/probe.log 2>&1 || true
          python3 scripts/probe_sources.py --conjunto rodada4 --limite-exemplo 400 \
            --salvar-dir out/probe > out/probe_rodada4.log 2>&1 || true
          python3 scripts/probe_sources.py --canais --limite-exemplo 200 \
            --salvar-dir out/probe > out/probe_canais.log 2>&1 || true
          cat out/probe_rodada4.log out/probe_canais.log >> out/probe.log
          tail -c 4000 out/probe.log
          echo "## Sonda de fontes oficiais" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(=== |    status=|    info:)" out/probe.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar saída do diagnóstico (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: |
            out/probe
            out/fontes_reais.json
            out/fontes_reais.log
            out/probe.log
            out/probe_rodada4.log
            out/probe_canais.log
            out/execucao_dry_run.log
          retention-days: 7
      - name: Publicar o diagnóstico no branch (mesmo padrão do workflow de produção)
        if: always()
        run: |
          git config user.name "monitor-legislativo-bot"
          git config user.email "monitor-legislativo-bot@users.noreply.github.com"
          git add -Af out/probe out/probe.log out/probe_rodada4.log \
            out/probe_canais.log out/fontes_reais.json out/fontes_reais.log \
            out/execucao_dry_run.log
          echo "--- arquivos a publicar ---"
          git status --porcelain | head -40
          if git diff --cached --quiet; then
            echo "Diagnóstico sem alterações a publicar."
            exit 0
          fi
          git commit -m "chore(diag): sonda e ensaio das fontes oficiais"
          echo "--- push ---"
          if ! git push origin HEAD:${{ github.ref_name }}; then
            # corrida com outro push no mesmo branch: sincroniza e repete
            echo "push recusado — sincronizando com o branch e repetindo"
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || git rebase --abort || true
            git push origin HEAD:${{ github.ref_name }}
          fi
          git log --oneline -1
